    <!-- SoundCloud Official HTML5 Widget API (deferred to prevent render-blocking) -->
    <script defer src="https://w.soundcloud.com/player/api.js"></script>

  <body class="bg-[var(--bg-base)] text-[var(--text-main)] antialiased min-h-screen">
    <div id="root"></div>
    <script>
      // On static hosts like GitHub Pages where raw JSX cannot execute, load the precompiled bundle
      if (!document.querySelector('script[src*="./assets/index.js"]') && (window.location.hostname.endsWith('github.io') || window.location.protocol === 'file:')) {
        var entry = document.getElementById('main-entry');
        if (entry) {
          entry.remove();
        }
        var timestamp = Date.now();
        var s = document.createElement('script');
        s.type = 'module';
        s.crossOrigin = 'anonymous';
        s.src = './assets/index.js?v=' + timestamp;
        document.head.appendChild(s);
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = './assets/index.css?v=' + timestamp;
        document.head.appendChild(l);
      }
    </script>
  </body>
